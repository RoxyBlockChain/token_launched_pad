<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)" stroke="url(#grad2)" stroke-width="2"/>
  
  <!-- Rocket icon -->
  <g transform="translate(50, 45) rotate(-45)">
    <!-- Rocket body -->
    <ellipse cx="0" cy="0" rx="12" ry="20" fill="url(#grad2)" />
    <!-- Rocket nose -->
    <polygon points="0,-20 -8,-8 8,-8" fill="#f3f4f6" />
    <!-- Window -->
    <circle cx="0" cy="-6" r="4" fill="#06b6d4" />
    <!-- Fins -->
    <polygon points="-12,8 -18,18 -10,12" fill="#f3f4f6" />
    <polygon points="12,8 18,18 10,12" fill="#f3f4f6" />
    <!-- Flame -->
    <ellipse cx="0" cy="22" rx="5" ry="8" fill="#fbbf24" opacity="0.8" />
    <ellipse cx="0" cy="24" rx="3" ry="6" fill="#f59e0b" opacity="0.8" />
    <!-- Speed lines -->
    <line x1="-16" y1="-14" x2="-22" y2="-18" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="16" y1="-14" x2="22" y2="-18" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="-18" y1="-4" x2="-24" y2="-4" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
    <line x1="18" y1="-4" x2="24" y2="-4" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  </g>
  
  <!-- Coins/stars around rocket -->
  <circle cx="20" cy="25" r="3" fill="#fcd34d" opacity="0.6"/>
  <circle cx="78" cy="30" r="2.5" fill="#fcd34d" opacity="0.5"/>
  <circle cx="25" cy="75" r="2" fill="#fcd34d" opacity="0.4"/>
  <circle cx="75" cy="70" r="3" fill="#fcd34d" opacity="0.6"/>
  
  <!-- Small stars -->
  <path d="M15,15 L16,12 L17,15 L20,16 L17,17 L16,20 L15,17 L12,16 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M85,15 L86,12 L87,15 L90,16 L87,17 L86,20 L85,17 L82,16 Z" fill="#ffffff" opacity="0.3"/>
</svg>